<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خريطة الألم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>خريطة الألم</h1>
<p class="subtitle">اضغط على مكان الألم في جسمك</p>

<!-- 👇 الجسم -->
<div class="body-wrapper">

<svg viewBox="0 0 200 400" class="body">

<circle cx="100" cy="40" r="18" class="part" data-area="head"/>
<rect x="85" y="60" width="30" height="100" class="part" data-area="back"/>
<rect x="60" y="80" width="20" height="80" class="part" data-area="arm"/>
<circle cx="70" cy="170" r="8" class="part" data-area="finger"/>

</svg>

</div>

<!-- 👇 الأسئلة -->
<div id="questions" class="card hidden">

<h3>وش نوع الألم؟</h3>
<div class="options">
<button data-pain="tight">شد</button>
<button data-pain="sharp">وخز</button>
<button data-pain="pulse">نابض</button>
</div>

<h3>قوة الألم</h3>
<input type="range" min="1" max="10" id="severity">

<h3>مدة الألم</h3>
<div class="options">
<button data-duration="short">أقل من يوم</button>
<button data-duration="medium">1-3 أيام</button>
<button data-duration="long">أكثر من 3 أيام</button>
</div>

</div>

<!-- 👇 النتيجة -->
<div id="result" class="card hidden"></div>

<button class="follow" onclick="followUp()">متابعة حالتي</button>

<footer>Programmer: Atheer</footer>

</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Health AI Agent</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app">

<header>
<h1>Health AI Agent</h1>
<p>Interactive Intelligent Diagnosis System</p>
</header>

<!-- 🔥 جسم -->
<div class="body-wrapper">

<svg viewBox="0 0 200 400" class="body-svg">

<circle cx="100" cy="40" r="18" class="part" data-area="head"/>
<rect x="85" y="60" width="30" height="100" class="part" data-area="back"/>
<rect x="60" y="80" width="20" height="80" class="part" data-area="arm"/>
<circle cx="70" cy="170" r="8" class="part" data-area="finger"/>

</svg>

</div>

<!-- 🔥 الأسئلة -->
<div id="questions" class="card hidden">

<h3>Describe Pain Type</h3>
<div class="options">
<button data-pain="tight">Tight</button>
<button data-pain="sharp">Sharp</button>
<button data-pain="pulse">Pulsating</button>
</div>

<h3>Severity</h3>
<input type="range" min="1" max="10" id="severity">

<h3>Duration</h3>
<select id="duration">
<option value="short">Less than 1 day</option>
<option value="medium">1-3 days</option>
<option value="long">More than 3 days</option>
</select>

</div>

<!-- 🔥 النتيجة -->
<div id="result" class="card result hidden"></div>

<button class="follow" onclick="followUp()">Follow Up</button>

<footer>Programmer: Atheer</footer>

</div>

<script src="script.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
